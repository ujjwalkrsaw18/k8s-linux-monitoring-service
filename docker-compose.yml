version: '3.8'
services:
  api:
    build: .
    container_name: fastapi_monitor
    ports:
      - "8000:8000"
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
