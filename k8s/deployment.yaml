apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-monitor-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: linux-monitor
  template:
    metadata:
      labels:
        app: linux-monitor
    spec:
      containers:
      - name: monitor-api
        image: monitoring-api:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: monitor-config
        - secretRef:
            name: monitor-secret
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
